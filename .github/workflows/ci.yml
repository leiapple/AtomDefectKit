name: CI

on:
  push:
    branches: ["main", "codex/development"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.11

      - name: Check lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run --group dev pytest

      - name: Build package
        run: uv build --no-sources
