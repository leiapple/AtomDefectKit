[project]
name = "AtomDefectKit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lei Zhang", email = "lei.zhang9@tue.nl" }
]

requires-python = ">=3.11,<3.12"
dependencies = [
    "atomman>=1.5.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matscipy>=1.1,<1.2",
    "tensorpotential>=0.5.9",
]

[project.optional-dependencies]
ace = [
    "setuptools<81",
    "pyace @ git+https://github.com/ICAMS/python-ace.git",
]

[project.scripts]
atomdefectkit = "atomdefectkit:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
