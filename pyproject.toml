[project]
name = "atomdefectkit"
version = "0.1.0"
description = "Atomistic defect workflows and model-loader utilities for BCC metals."
readme = "README.md"
authors = [
    { name = "Lei Zhang", email = "lei.zhang9@tue.nl" }
]
maintainers = [
    { name = "Lei Zhang", email = "lei.zhang9@tue.nl" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "atomistic simulation",
    "defects",
    "bcc metals",
    "machine-learned interatomic potentials",
    "materials science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.11,<3.14"
dependencies = [
    "atomman>=1.5.2",
    "matscipy>=1.1,<2.0",
    "pandas>=2.2.3; extra != 'pace'",
    "phonopy>=4.1.0",
    "spglib>=2.7.0",
]

[project.optional-dependencies]
pace = [
    "setuptools<81; python_version == '3.11'",
    "pyace @ git+https://github.com/ICAMS/python-ace.git ; python_version == '3.11'",
]
grace = ["tensorpotential>=0.5.9", "pandas>=2.2.3"]
fairchem = ["fairchem-core>=2.3,<3.0", "pandas>=2.2.3"]
mace = ["mace-torch", "cuequivariance", "cuequivariance-torch", "pandas>=2.2.3"]
mattersim = ["mattersim", "pandas>=2.2.3"]
7net = ["sevenn", "pandas>=2.2.3"]
nequip = ["nequip", "pandas>=2.2.3"]
nequix = ["nequix", "pandas>=2.2.3"]
upet = ["upet", "pandas>=2.2.3"]
chgnet = ["chgnet", "pandas>=2.2.3"]

[project.scripts]
atomdefectkit = "atomdefectkit:main"

[project.urls]
Homepage = "https://github.com/leiapple/AtomDefectKit"
Repository = "https://github.com/leiapple/AtomDefectKit"
Issues = "https://github.com/leiapple/AtomDefectKit/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "7net" },
        { extra = "chgnet" },
        { extra = "fairchem" },
        { extra = "grace" },
        { extra = "mace" },
        { extra = "mattersim" },
        { extra = "nequip" },
        { extra = "nequix" },
        { extra = "pace" },
        { extra = "upet" },
    ],
]

[tool.uv.extra-build-dependencies]
maxvolpy = ["numpy<1.24", "setuptools<60", "Cython<3"]

[tool.uv.extra-build-variables]
maxvolpy = { SETUPTOOLS_USE_DISTUTILS = "stdlib" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:'oneOf' deprecated - use 'one_of':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'parseString' deprecated - use 'parse_string':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'resetCache' deprecated - use 'reset_cache':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'enablePackrat' deprecated - use 'enable_packrat':DeprecationWarning:matplotlib\\._mathtext",
    "ignore:read_text is deprecated\\. Use files\\(\\) instead\\.:DeprecationWarning:DataModelDict",
    "ignore:open_text is deprecated\\. Use files\\(\\) instead\\.:DeprecationWarning:importlib\\.resources\\._legacy",
]
